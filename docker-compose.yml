version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: produto-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_INITDB_DATABASE: todo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - produtonet

  backend:
    build:
      context: ./produtolist
    container_name: produto-backend
    depends_on:
      - mongodb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/todo
      SPRING_DATASOURCE_USERNAME: mongo_user
      SPRING_DATASOURCE_PASSWORD: mongo_pass
    ports:
      - "8080:8080"
    networks:
      - produtonet

  frontend:
    build:
      context: ./frontend
    container_name: produto-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - produtonet

volumes:
  mysql-data:

networks:
  todonet:
